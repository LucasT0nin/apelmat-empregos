components:
  schemas:
    AccountTypeEnum:
      enum:
      - professional
      - contractor
      - both
      type: string
      description: |-
        * `professional` - Profissional
        * `contractor` - Contratante
        * `both` - Ambos
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        opportunity:
          type: string
          format: uuid
        opportunity_title:
          type: string
          readOnly: true
        applicant_id:
          type: string
          format: uuid
          readOnly: true
        applicant_name:
          type: string
          readOnly: true
        applicant_email:
          type: string
          readOnly: true
        applicant_phone:
          type: string
          readOnly: true
        applicant_resume_url:
          type: string
          nullable: true
          readOnly: true
        professional_id:
          type: string
          format: uuid
          readOnly: true
        professional_name:
          type: string
          readOnly: true
        professional_email:
          type: string
          readOnly: true
        professional_phone:
          type: string
          readOnly: true
        professional_resume_url:
          type: string
          nullable: true
          readOnly: true
        cover_letter:
          type: string
        proposed_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - applicant_email
      - applicant_id
      - applicant_name
      - applicant_phone
      - applicant_resume_url
      - created_at
      - id
      - opportunity
      - opportunity_title
      - professional_email
      - professional_id
      - professional_name
      - professional_phone
      - professional_resume_url
      - updated_at
    ApplicationStatusEnum:
      enum:
      - submitted
      - reviewing
      - accepted
      - rejected
      - withdrawn
      type: string
      description: |-
        * `submitted` - Enviada
        * `reviewing` - Em analise
        * `accepted` - Aceita
        * `rejected` - Recusada
        * `withdrawn` - Retirada
    AreaEnum:
      enum:
      - operador
      - administrativo
      - logistica
      - manutencao
      - eletrica
      - mecanica
      - transporte
      - limpeza
      - producao
      - seguranca
      - outros
      type: string
      description: |-
        * `operador` - Operador
        * `administrativo` - Administrativo
        * `logistica` - Logistica
        * `manutencao` - Manutencao
        * `eletrica` - Eletrica
        * `mecanica` - Mecanica
        * `transporte` - Transporte
        * `limpeza` - Limpeza
        * `producao` - Producao
        * `seguranca` - Seguranca
        * `outros` - Outros
    AvailabilityEnum:
      enum:
      - available
      - busy
      - unavailable
      type: string
      description: |-
        * `available` - Disponivel
        * `busy` - Ocupado
        * `unavailable` - Indisponivel
    BlankEnum:
      enum:
      - ''
    Block:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        blocked:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blocked
      - created_at
      - id
    BudgetTypeEnum:
      enum:
      - fixed
      - hourly
      - negotiable
      type: string
      description: |-
        * `fixed` - Valor fechado
        * `hourly` - Por hora
        * `negotiable` - A combinar
    CatalogStatusEnum:
      enum:
      - draft
      - review
      - published
      - paused
      - rejected
      type: string
      description: |-
        * `draft` - Rascunho
        * `review` - Em analise
        * `published` - Publicado
        * `paused` - Pausado
        * `rejected` - Recusado
    ContactRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company_id:
          type: string
          format: uuid
          readOnly: true
        company_name:
          type: string
          readOnly: true
        professional:
          type: string
          format: uuid
          writeOnly: true
        professional_id:
          type: string
          format: uuid
          readOnly: true
        professional_name:
          type: string
          readOnly: true
        professional_city:
          type: string
          readOnly: true
        professional_state:
          type: string
          readOnly: true
        objective:
          type: string
          format: uuid
          nullable: true
        role:
          type: string
          readOnly: true
        role_label:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ContactRequestStatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        professional_email:
          type: string
          nullable: true
          readOnly: true
        professional_phone:
          type: string
          nullable: true
          readOnly: true
        resume_download_url:
          type: string
          nullable: true
          readOnly: true
        release_notes:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - company_id
      - company_name
      - created_at
      - decided_at
      - id
      - professional
      - professional_city
      - professional_email
      - professional_id
      - professional_name
      - professional_phone
      - professional_state
      - release_notes
      - resume_download_url
      - role
      - role_label
      - status
      - status_label
      - updated_at
    ContactRequestStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - cancelled
      type: string
      description: |-
        * `pending` - Em analise
        * `approved` - Contato liberado
        * `rejected` - Recusado
        * `cancelled` - Cancelado
    ContractorProfile:
      type: object
      properties:
        company_name:
          type: string
          maxLength: 160
        document:
          type: string
          writeOnly: true
          maxLength: 30
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 2
    ListingTypeEnum:
      enum:
      - work_offer
      - hiring
      type: string
      description: |-
        * `work_offer` - Profissional oferecendo trabalho
        * `hiring` - Contratante buscando profissional
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/NotificationKindEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        opportunity:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        professional:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        contact_request:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - contact_request
      - created_at
      - id
      - kind
      - opportunity
      - professional
      - title
    NotificationKindEnum:
      enum:
      - new_resume
      - new_opportunity
      - application
      - application_status
      - profile_review
      - contact_request
      - contact_released
      - contact_rejected
      type: string
      description: |-
        * `new_resume` - Novo curriculo
        * `new_opportunity` - Nova oportunidade
        * `application` - Candidatura
        * `application_status` - Status da candidatura
        * `profile_review` - Analise de curriculo
        * `contact_request` - Solicitacao de contato
        * `contact_released` - Contato liberado
        * `contact_rejected` - Contato recusado
    Opportunity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner_id:
          type: string
          format: uuid
          readOnly: true
        owner_name:
          type: string
          readOnly: true
        owner_email:
          type: string
          nullable: true
          readOnly: true
        owner_phone:
          type: string
          nullable: true
          readOnly: true
        owner_resume_url:
          type: string
          nullable: true
          readOnly: true
        category:
          type: string
          format: uuid
        category_name:
          type: string
          readOnly: true
        listing_type:
          $ref: '#/components/schemas/ListingTypeEnum'
        kind:
          $ref: '#/components/schemas/OpportunityKindEnum'
        title:
          type: string
          maxLength: 140
        description:
          type: string
        city:
          type: string
