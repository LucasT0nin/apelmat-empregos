  /api/marketplace/notifications/:
    get:
      operationId: api_marketplace_notifications_list
      parameters:
      - in: query
        name: is_read
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - application
          - application_status
          - contact_rejected
          - contact_released
          - contact_request
          - new_opportunity
          - new_resume
          - profile_review
        description: |-
          * `new_resume` - Novo curriculo
          * `new_opportunity` - Nova oportunidade
          * `application` - Candidatura
          * `application_status` - Status da candidatura
          * `profile_review` - Analise de curriculo
          * `contact_request` - Solicitacao de contato
          * `contact_released` - Contato liberado
          * `contact_rejected` - Contato recusado
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
