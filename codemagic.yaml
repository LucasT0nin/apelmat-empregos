workflows:
  ios-testflight:
    name: Apelmat Empregos iOS - TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - apelmat_ios_appstore_profile
        certificates:
          - apelmat_ios_distribution
      vars:
        API_BASE_URL: https://empregos.apelmat.com.br/api

    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd app
          find ios -name "Podfile" -execdir pod install \;

      - name: Set up iOS code signing
        script: |
          cd app
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd app
          flutter build ipa --release --dart-define=API_BASE_URL=$API_BASE_URL

    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
