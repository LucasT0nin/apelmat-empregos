workflows:
  ios-testflight:
    name: Apelmat Empregos iOS - TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - br.com.apelmat.apelmatempregos
        certificates:
          - apelmat_ios_distribution
      vars:
        API_BASE_URL: https://empregos.apelmat.com.br/api
        IOS_BUILD_NAME: "1.0"

    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd app
          find ios -name "Podfile" -execdir pod install \;

      - name: Set up iOS code signing
        script: |
          cd app
          xcode-project use-profiles --project ios/Runner.xcodeproj --code-signing-setup-verbose-logging

      - name: Build iOS IPA
        script: |
          cd app
          flutter build ipa --release --dart-define=API_BASE_URL=$API_BASE_URL --build-name=$IOS_BUILD_NAME --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
