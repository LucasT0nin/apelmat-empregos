name: apelmat-empregos

services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ${VPS_ENV_FILE:-.env.vps-external}
    environment:
      DB_ENGINE: mysql
    command:
      - /bin/sh
      - -c
      - |
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec gunicorn config.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers "$${GUNICORN_WORKERS:-3}" \
          --timeout 120 \
          --access-logfile - \
          --error-logfile -
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    stop_grace_period: 30s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ${VPS_ENV_FILE:-.env.vps-external}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
